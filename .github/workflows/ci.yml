name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        # The clips (P2-T03) and the e2e microphone fixture (P1-T14) are in LFS; without
        # this they check out as 130-byte pointers, which failed every run from 2026-09-22.
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion

      # The same two commands the README gives a contributor.
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  # P0-T06. Proves the vector schema, the binary encoding and the index against a real
  # MariaDB, which the rest of the gate cannot: no Docker exists on the development
  # machine, so this job is the only automated exercise of the SQL.
  #
  # It is not the spike's measurement. This runs a couple of thousand rows on GitHub's
  # hardware over loopback; the numbers in docs/spikes/C-mariadb-vector.md come from a real
  # server over a real network. What this catches is the schema breaking.
  vector:
    name: mariadb vector
    runs-on: ubuntu-latest

    services:
      mariadb:
        # Pinned to the version the development server runs, so CI and development agree
        # about what "it works" means (docs/SURFACE.md, 2026-09-09).
        image: mariadb:11.8.8
        env:
          # Ephemeral, and reachable only from this job's own container for its lifetime.
          # Not a secret: nothing outside the runner can connect to it, and it is destroyed
          # with the job.
          MARIADB_ROOT_PASSWORD: ci-throwaway-root
          MARIADB_DATABASE: latentpresence
          MARIADB_USER: presenceuser
          MARIADB_PASSWORD: ci-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      # P5-T05 (ADR-46): a Postgres for the read-only database suite
      # (`crates/server/tests/sql_databases.rs`). Ephemeral like the MariaDB above.
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: reader
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reader -d shop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion

      # The migration runs first, inside `bench`, so a schema that MariaDB rejects fails
      # here rather than on someone's machine.
      - name: schema, encoding and index against a real MariaDB
        env:
          DATABASE_URL: mysql://presenceuser:ci-throwaway@127.0.0.1:3306/latentpresence
        run: >-
          cargo run --release --manifest-path companion/Cargo.toml
          --bin latentpresence-companion -- bench 2000

      # P4-T01. The memory schema on the same server: a model's vector table, the retrieval
      # shape on its index, the cascades. Leaves nothing behind.
      - name: memory schema against a real MariaDB
        env:
          DATABASE_URL: mysql://presenceuser:ci-throwaway@127.0.0.1:3306/latentpresence
        run: >-
          cargo run --release --manifest-path companion/Cargo.toml
          --bin latentpresence-companion -- memory-check

      # ADR-35. Every build compiles the `query!` macros offline from the committed
      # `companion/crates/db/.sqlx`; this is where that cache is checked against the schema
      # the migrations above produced. `SQLX_OFFLINE=false` overrides `.cargo/config.toml`.
      - name: install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features mysql,rustls

      - name: the committed query cache matches the schema
        working-directory: companion/crates/db
        env:
          DATABASE_URL: mysql://presenceuser:ci-throwaway@127.0.0.1:3306/latentpresence
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --check

      # P4-T02. The memory routes' integration tests (`crates/server/tests/memory_api.rs`)
      # against the same server: every implemented route, every response body checked
      # against the committed OpenAPI file. Unset, they would otherwise skip silently.
      # P5-T05: the read-only database suite runs here against both servers.
      - name: memory API integration tests against a real MariaDB
        env:
          LP_TEST_DATABASE_URL: mysql://presenceuser:ci-throwaway@127.0.0.1:3306/latentpresence
          LP_TEST_POSTGRES_URL: postgres://reader:ci-throwaway@127.0.0.1:5432/shop
        run: cargo test --manifest-path companion/Cargo.toml --workspace

      # P4-T04. The TypeScript `MemoryStore` conformance suite through `CompanionMemoryStore`
      # against a running companion on the same server — the rules every store keeps, checked
      # end to end. Skipped in `pnpm gate`, which has no companion.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: MemoryStore conformance through a running companion
        env:
          DATABASE_URL: mysql://presenceuser:ci-throwaway@127.0.0.1:3306/latentpresence
          COMPANION_PORT: "8799"
          LP_TEST_COMPANION_URL: http://127.0.0.1:8799
        run: |
          cargo build --release --manifest-path companion/Cargo.toml --bin latentpresence-companion
          ./companion/target/release/latentpresence-companion &
          for i in $(seq 1 30); do curl -sf "$LP_TEST_COMPANION_URL/health" && break; sleep 1; done
          pnpm vitest run packages/providers/src/memory/companion.conformance.test.ts

  # P1-T14. The Phase 1 end-to-end test: a real Chromium, a fake microphone, and the voice
  # pipeline from `getUserMedia` to barge-in.
  #
  # **A job of its own rather than part of `pnpm gate`**, for the same reason `vector` is:
  # the gate runs on two operating systems and on every contributor's machine before every
  # commit, and this needs a 115 MB browser download that only ever exercises Chromium.
  # Linux only, for the same reason — the browser is the subject, not the platform.
  #
  # It downloads Silero's 2.2 MB from Hugging Face and nothing else: the language model, the
  # voice and recognition are fakes, so there is no WebGPU requirement and no 325 MB Kokoro.
  # The run itself is ~9 s against the plan's two-minute budget.
  e2e:
    name: end-to-end (chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        # The clips (P2-T03) and the e2e microphone fixture (P1-T14) are in LFS; without
        # this they check out as 130-byte pointers, which failed every run from 2026-09-22.
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keyed on the lockfile: a Playwright bump changes the browser build it wants, and a
      # stale cache would silently test the wrong Chromium.
      - name: cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: install chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      # The system libraries are not in the cache above, so they are installed either way.
      - name: install chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
