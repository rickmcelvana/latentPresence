[package]
name = "latentpresence-desktop"
version = "0.1.0"
description = "latentPresence for the desktop: the web app in a window, with the companion inside (P8-T01)"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rickmcelvana/latentPresence"

# Its own workspace, not a member of `companion/`: the companion is a path dependency below, and
# the shell's tauri tree stays out of the companion's lockfile. `pnpm gate` checks both (P8-T01
# reverses Spike E's "on demand only").
[workspace]

[lib]
name = "latentpresence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# Versions read from crates.io on 2026-10-16 (docs/SURFACE.md). The plugins below need tauri ^2.12.
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-log = "2.10.1"
# The page's `Notification` goes through this plugin's polyfill (ADR-58's reminders when hidden).
tauri-plugin-notification = "2.7.0"
# A second launch focuses the first window instead of starting a second companion.
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
# P8-T06 (ADR-63): the system folder and file dialogs, so a person picks every folder the
# companion may read; the page never names one. Used from Rust only, no JS permission.
tauri-plugin-dialog = "2.8.1"
# Read from crates.io 2026-10-19: 2.13.1 is the newest older than two weeks. No zip feature: our
# updates are the NSIS installer itself (createUpdaterArtifacts v2), never an archive.
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
# API keys in Windows Credential Manager (ADR-60). Default feature `v1`: Windows' native store.
keyring = "4.2.0"
log = "0.4"
# The companion, run in this process (ADR-60): same router, same startup as `pnpm companion`.
latentpresence-companion = { path = "../../../companion/crates/server" }
tokio = { version = "1.53", features = ["net", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
# `generate_context!` embeds the plugins' config (the updater's, P8-T04) through it.
serde_json = "1.0.151"
