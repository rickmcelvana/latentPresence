[workspace]
resolver = "3"
members = ["crates/server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rickmcelvana/latentPresence"

[workspace.dependencies]
axum = "0.8.9"
http-body-util = "0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `macros` is here for `sqlx::migrate!`, which reads the migrations directory at compile
# time and needs no database. The `query!` family is deliberately not used: those want a
# live DATABASE_URL at build time or a checked-in offline cache, and neither belongs in a
# gate that has to pass on a machine with no database. No TLS feature - the dev server
# accepts plaintext on the LAN, and the remote path is inside a tunnel that provides its own.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "migrate", "macros"] }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5.3"
