[workspace]
resolver = "3"
members = ["crates/server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rickmcelvana/latentPresence"

[workspace.dependencies]
axum = "0.8.9"
http-body-util = "0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5.3"
