[workspace]
resolver = "3"
members = ["crates/db", "crates/server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rickmcelvana/latentPresence"

[workspace.dependencies]
latentpresence-db = { path = "crates/db" }
axum = "0.8.9"
http-body-util = "0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `macros` is for `sqlx::migrate!` and, since P4-T01 (ADR-35), the `query!` family on the
# static tables: checked at build time against the committed `crates/db/.sqlx` cache, with
# `SQLX_OFFLINE=true` from the repo's `.cargo/config.toml`, so no build ever needs a database.
# CI's `vector` job checks that cache against a real MariaDB. No TLS feature - the dev server
# accepts plaintext on the LAN, and the remote path is inside a tunnel that provides its own.
# `chrono` (P4-T02): DATETIME(3) columns need a calendar type in `query!`'s checked rows, and
# the protocol's ISO-8601 timestamps parse straight into it. `json` (P4-T02): the retrieval
# union and `turns.user_affect` carry `serde_json::Value` through the driver directly.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "migrate", "macros", "chrono", "json"] }
# `process`, `io-util`, `time` (P5-T02): the MCP host starts servers, reads their stderr, and
# gives each a deadline.
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "process", "io-util", "time"] }
tower = "0.5.3"
# ADR-29: the relay for endpoints that refuse browser origins. rustls with aws-lc-rs is the
# 0.13 default TLS; no system proxy lookup, no cookies, no decompression - bytes pass through.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
futures-util = "0.3.34"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# P4-T02 integration tests validate every response against the committed OpenAPI file.
jsonschema = "0.35"
rand = "0.9"
# P5-T02 (ADR-43): the companion's MCP host. The official Rust SDK (Apache-2.0), client side
# only: stdio servers it starts from its own config file, and streamable-HTTP servers that
# refuse browser origins, through the reqwest it already has. No server macros, no schemars.
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
