[package]
name = "latentpresence-companion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional local service for latentPresence: MariaDB vector memory, document ingest, MCP tools."

[[bin]]
name = "latentpresence-companion"
path = "src/main.rs"

[dependencies]
axum.workspace = true
latentpresence-db.workspace = true
latentpresence-ingest.workspace = true
notify.workspace = true
# P5-T06 (ADR-47): a search query and a JSON body for the web providers.
reqwest = { workspace = true, features = ["query", "json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
rmcp.workspace = true
futures-util.workspace = true
sha2.workspace = true
# P5-T05 (ADR-46): the person's own databases, read-only. `sqlite-bundled` without
# `sqlite-load-extension`, so a query cannot load one.
sqlx = { workspace = true, features = ["postgres", "sqlite-bundled", "rust_decimal", "uuid"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
# P5-T06 (ADR-47): `url::Host` for read_page's address check; the version reqwest already uses.
url = "2.5.8"
# P6-T07b (ADR-57): when a companion schedule fires.
croner.workspace = true
chrono-tz.workspace = true
# P8-T01 (ADR-60): the desktop app's pairing token, from the OS's random source.
rand.workspace = true

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
jsonschema.workspace = true
tempfile.workspace = true
zip.workspace = true
