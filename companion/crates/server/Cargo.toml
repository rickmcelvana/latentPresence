[package]
name = "latentpresence-companion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional local service for latentPresence: MariaDB vector memory, document ingest, MCP tools."

[[bin]]
name = "latentpresence-companion"
path = "src/main.rs"

[dependencies]
axum.workspace = true
latentpresence-db.workspace = true
latentpresence-ingest.workspace = true
notify.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
rmcp.workspace = true
futures-util.workspace = true
# P5-T05 (ADR-46): the person's own databases, read-only. `sqlite-bundled` without
# `sqlite-load-extension`, so a query cannot load one.
sqlx = { workspace = true, features = ["postgres", "sqlite-bundled", "rust_decimal", "uuid"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
jsonschema.workspace = true
rand.workspace = true
tempfile.workspace = true
zip.workspace = true
