packages:
  - apps/*
  - packages/*

# pnpm 11 refuses dependency versions published in the last few days unless they are
# listed here. Keep that protection: pin ranges a little behind the very newest release
# rather than adding exclusions.

# Native install scripts, allowed or denied one at a time. transformers.js brings
# onnxruntime-node and sharp for its Node runtime, and protobufjs builds alongside them.
# apps/web is a browser bundle and imports none of the three, so these are denied: a
# native postinstall we never use is build time and supply-chain surface for nothing.
# If anything here ever runs transformers.js under Node, this is the list to revisit.
allowBuilds:
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# P9-T03 (ADR-69): `pnpm audit --prod` (the weekly `audit` workflow) skips these, each for one
# reason. sharp is transformers.js's Node image path: the browser bundle never imports it, its
# install script is denied above, and nothing we ship or run decodes an image with it.
# (`pnpm audit --ignore <GHSA>` writes here, measured with pnpm 12.3.4.)
auditConfig:
  ignoreGhsas:
    - GHSA-f88m-g3jw-g9cj
    - GHSA-rgj7-g3m4-5g8c
    - GHSA-wq5f-xc86-pv6w

# P9-T03: the AI SDK's provider-utils pins undici 7.29.1, which has eight advisories fixed in
# 7.30.1 (released 2026-10-15). undici is its Node path only — the browser bundle uses fetch —
# but the live scripts run it, and a patch release inside 7.x is the cheap fix. Drop this when
# provider-utils moves past it.
overrides:
  undici: ^7.30.1
